services:
  # --- Smoke-тесты (быстрая проверка) ---
  smoke:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demoqa-smoke
    environment:
      - BASE_URL=https://demoqa.com
      - BROWSER=chromium
      - HEADLESS=true
      - TIMEOUT=30000
      - SCREENSHOT_ON_FAIL=true
    volumes:
      - ./reports:/app/reports
    command: [
      "-m", "smoke",
      "--html=reports/html/smoke-report.html",
      "--self-contained-html",
      "-v"
    ]

  # --- Regression-тесты (полный набор) ---
  regression:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demoqa-regression
    environment:
      - BASE_URL=https://demoqa.com
      - BROWSER=chromium
      - HEADLESS=true
      - TIMEOUT=30000
      - SCREENSHOT_ON_FAIL=true
    volumes:
      - ./reports:/app/reports
    command: [
      "--html=reports/html/regression-report.html",
      "--self-contained-html",
      "-v"
    ]

  # ─────────────────────────────────────────────
  # Движок Blink (Chromium) — Google Chrome, Яндекс Браузер, Edge
  # ─────────────────────────────────────────────
  tests-chromium:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demoqa-chromium
    environment:
      - BASE_URL=https://demoqa.com
      - BROWSER=chromium
      - HEADLESS=true
      - SCREENSHOT_ON_FAIL=true
    volumes:
      - ./reports:/app/reports
    command: [
      "--html=reports/html/chromium-report.html",
      "--self-contained-html",
      "-v"
    ]

  # ─────────────────────────────────────────────
  # Движок Gecko — Mozilla Firefox
  # ─────────────────────────────────────────────
  tests-firefox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demoqa-firefox
    environment:
      - BASE_URL=https://demoqa.com
      - BROWSER=firefox
      - HEADLESS=true
      - SCREENSHOT_ON_FAIL=true
    volumes:
      - ./reports:/app/reports
    command: [
      "--html=reports/html/firefox-report.html",
      "--self-contained-html",
      "-v"
    ]

  # ─────────────────────────────────────────────
  # Движок WebKit — Safari (macOS / iOS)
  # ─────────────────────────────────────────────
  tests-webkit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demoqa-webkit
