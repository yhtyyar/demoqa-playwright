name: DemoQA Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # Nightly regression — каждый день в 02:00 UTC
  workflow_dispatch:
    inputs:
      test_marker:
        description: "Маркер тестов (smoke, regression, ui или пусто для всех)"
        required: false
        default: "smoke"

env:
  DOCKER_IMAGE: demoqa-tests
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Линтинг и статический анализ
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax (py_compile)
        run: |
          python -m py_compile conftest.py
          python -m py_compile main.py
          find config pages tests utils -name "*.py" -exec python -m py_compile {} +

      - name: Lint with flake8
        run: flake8 config pages tests utils conftest.py main.py

      - name: Check formatting with black
        run: black --check --diff .

  # ─────────────────────────────────────────────
  # Job 2: Сборка Docker-образа
  # ─────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: docker save ${{ env.DOCKER_IMAGE }}:${{ github.sha }} -o /tmp/docker-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar
          retention-days: 1

  # ─────────────────────────────────────────────
  # Job 3: Smoke-тесты
  # ─────────────────────────────────────────────
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/docker-image.tar

      - name: Run smoke tests in Docker
        run: |
          docker run --rm \
            -e BASE_URL=https://demoqa.com \
            -e BROWSER=chromium \
            -e HEADLESS=true \
            -e SCREENSHOT_ON_FAIL=true \
            -v ${{ github.workspace }}/reports:/app/reports \
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            -m smoke \
            --html=reports/html/smoke-report.html \
            --self-contained-html \
            --junitxml=reports/xml/smoke-results.xml \
            -v

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            reports/html/smoke-report.html
            reports/xml/smoke-results.xml
            reports/screenshots/
          retention-days: 14

      - name: Upload Allure results (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: reports/allure-results/
          if-no-files-found: ignore
          retention-days: 1

  # ─────────────────────────────────────────────
  # Job 4: Regression-тесты (матрица движков)
  # Blink (Chromium) — Chrome, Яндекс, Edge
  # Gecko (Firefox)  — Mozilla Firefox
  # WebKit           — Safari (macOS / iOS)
  # ─────────────────────────────────────────────
  regression:
    name: Regression (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            name: "Chromium (Chrome/Yandex)"
          - browser: firefox
            name: "Firefox (Gecko)"
          - browser: webkit
            name: "WebKit (Safari)"

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/docker-image.tar

      - name: Run regression tests — ${{ matrix.name }}
        run: |
          docker run --rm \
            -e BASE_URL=https://demoqa.com \
            -e BROWSER=${{ matrix.browser }} \
            -e HEADLESS=true \
            -e SCREENSHOT_ON_FAIL=true \
            -v ${{ github.workspace }}/reports:/app/reports \
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            --html=reports/html/${{ matrix.browser }}-report.html \
            --self-contained-html \
            --junitxml=reports/xml/${{ matrix.browser }}-results.xml \
            -v

      - name: Upload regression report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ matrix.browser }}
          path: |
            reports/html/${{ matrix.browser }}-report.html
            reports/xml/${{ matrix.browser }}-results.xml
            reports/screenshots/
          retention-days: 14

      - name: Upload Allure results (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: reports/allure-results/
          if-no-files-found: ignore
          retention-days: 1

  # ─────────────────────────────────────────────
  # Job 5: Публикация JUnit результатов
  # ─────────────────────────────────────────────
  report:
    name: Publish Results
    runs-on: ubuntu-latest
    needs: [smoke, regression]
    if: always()
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: "*-report*"
          merge-multiple: true

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "all-reports/**/xml/*.xml"
          check_name: Test Results
          comment_mode: "off"

  # ─────────────────────────────────────────────
  # Job 6: Деплой Allure Report на GitHub Pages
  # Запускается только на ветке main
  # Использует Allure CLI напрямую — надёжнее сторонних экшенов
  # ─────────────────────────────────────────────
  deploy-allure-report:
    name: Deploy Allure Report
    runs-on: ubuntu-latest
    needs: [smoke, regression]
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
        continue-on-error: true

      # Проверяем наличие результатов перед генерацией
      - name: Check allure results
        id: check
        run: |
          if find allure-results -name "*.json" 2>/dev/null | grep -q .; then
            echo "has_results=true" >> $GITHUB_OUTPUT
            echo "✅ Allure result files found"
          else
            echo "has_results=false" >> $GITHUB_OUTPUT
            echo "⚠️ No allure result files — skipping deploy"
          fi

      # Берём историю из gh-pages для trend-графиков
      - name: Get Allure history from gh-pages
        if: steps.check.outputs.has_results == 'true'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Копируем историю в results для отображения тренда
      - name: Restore Allure history
        if: steps.check.outputs.has_results == 'true'
        run: cp -r gh-pages/history allure-results/history 2>/dev/null || true

      # Устанавливаем Java (Allure CLI требует JRE 8+)
      - name: Setup Java
        if: steps.check.outputs.has_results == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Устанавливаем Allure CLI напрямую — без зависимости от сторонних экшенов
      - name: Install Allure CLI
        if: steps.check.outputs.has_results == 'true'
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz -O allure.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.27.0 /opt/allure-cli
          echo "/opt/allure-cli/bin" >> $GITHUB_PATH

      - name: Generate Allure Report
        if: steps.check.outputs.has_results == 'true'
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.has_results == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_orphan: true
          commit_message: "docs: update Allure report [skip ci]"
